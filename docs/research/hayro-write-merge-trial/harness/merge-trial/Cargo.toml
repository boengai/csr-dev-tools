[package]
name = "merge-trial"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not a member of wasm/ (or any root) workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Exactly one candidate per build, so each is measured for bytes on its own.
hw = ["dep:hayro-write", "dep:hayro-syntax"]
lo = ["dep:lopdf"]

[dependencies]
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
hayro-write = { version = "=0.9.0", optional = true }
hayro-syntax = { version = "=0.9.0", optional = true, default-features = false, features = ["std"] }
lopdf = { version = "=0.47.0", optional = true, default-features = false, features = ["wasm_js"] }

[profile.release]
lto = "fat"
opt-level = "z"
strip = "debuginfo"
codegen-units = 1
