[package]
name = "tool-gamma"
version = "0.0.0"
edition = "2024"

# The package name does not match the directory, and a renamed dioxus is
# turned to web through [features].
[dependencies]
ui = { path = "../../ui" }
dx = { package = "dioxus", version = "=0.7.10", optional = true }

[features]
web = ["dx/web"]
