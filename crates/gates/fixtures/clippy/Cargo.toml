# Must-fail fixture (ADR-0036 §8): one violation per denied lint and banned
# method. CI runs Clippy on it, expects the run to fail, and finds every line
# of `expected.txt` in the output. It is a workspace member so that it
# inherits the workspace lints, and it is never in the gated package list.
[package]
name = "gates-fixture-clippy"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dioxus = { workspace = true, features = ["web"] }
proc-macro2 = { workspace = true }

[lints]
workspace = true
