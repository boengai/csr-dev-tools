# cargo-deny (ADR-0036 §11, docs/quality/gates.md → "Dependencies"). A gate
# file: change it only in a `gates` PR. It runs over app's tree and each
# worker's tree (crates/gates/scripts/deny.sh), never over the untouched
# wasm/ crates, and it does not check the layers: ADR-0035's allowlist in the
# gates crate is the only layer gate, and it also holds the
# dioxus-primitives and dioxus-motion ban.

[graph]
all-features = false
no-default-features = false

[advisories]
# A vulnerability or an unsound crate fails. An unmaintained crate warns:
# deny.sh passes `-W unmaintained`. An ignore entry needs a reason.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
  # memmap2 0.9.10 comes with subsecond, Dioxus 0.7.10's hot-reload crate,
  # which never builds it for wasm32. The fix (>=0.9.11) is a `cargo update`,
  # which is a PR of its own; remove this entry with it.
  { id = "RUSTSEC-2026-0186", reason = "memmap2 under subsecond is never built for wasm32; the next cargo update fixes it" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unicode-3.0",
]
confidence-threshold = 0.93
# Anything else, MPL-2.0 included, is a per-crate exception with a reason:
# { crate = "name", allow = ["MPL-2.0"] },  # why
exceptions = []

[licenses.private]
# Our own unpublished crates are MIT through the workspace (the gates crate
# checks `license.workspace = true`).
ignore = true

[bans]
# Over app's tree a duplicate costs bytes, so it fails. deny.sh passes
# `-W duplicate` for the workers' trees, where it only warns.
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Each pair comes from Dioxus =0.7.10's own tree (ADR-0031 pins it), so no
# change of ours removes it. Each entry skips the older version only, so a
# third version still fails. Revisit them when the Dioxus pin moves.
skip = [
  # The asset macros: manganis-core 0.7.10 takes 0.8.0-alpha, which takes 0.7.2.
  { crate = "const-serialize@0.7.2", reason = "inside Dioxus 0.7.10 (manganis)" },
  { crate = "const-serialize-macro@0.7.2", reason = "inside Dioxus 0.7.10 (manganis)" },
  # sledgehammer_utils, under dioxus-interpreter-js.
  { crate = "rustc-hash@1.1.0", reason = "inside Dioxus 0.7.10 (dioxus-interpreter-js)" },
  # Proc macros and build-time crates: they cost no wasm bytes.
  { crate = "syn@2.0.117", reason = "build time only: async-trait, under dioxus-html, takes syn 3" },
  { crate = "thiserror@1.0.69", reason = "jni, under dioxus-asset-resolver; never built for wasm32" },
  { crate = "thiserror-impl@1.0.69", reason = "jni, under dioxus-asset-resolver; never built for wasm32" },
  { crate = "winnow@0.7.15", reason = "build time only: manganis-core's macros" },
  { crate = "windows-sys@0.45.0", reason = "jni, under dioxus-asset-resolver; never built for wasm32" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
