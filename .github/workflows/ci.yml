name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # Named apart so a failed push run on main cannot block the main -> develop
    # sync pull request, which has the same head commit and requires `ci`.
    name: ${{ github.event_name == 'push' && 'ci (push)' || 'ci' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its base parent, for the Tools it touches (screenshots).
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm/target
          key: rust-${{ runner.os }}-${{ hashFiles('wasm/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install wasm-opt (binaryen)
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_129/binaryen-version_129-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_129/bin" >> "$GITHUB_PATH"

      - name: Build WASM
        run: pnpm wasm:build

      - name: Rust Tests
        run: cd wasm && cargo test

      - name: Lint
        run: pnpm lint

      - name: Format Check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      # The cache holds the browsers, not the system libraries WebKit needs.
      - name: Install WebKit System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps webkit

      - name: E2E Tests
        run: pnpm test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # The UX parity harness against the built React site, no retries
      # (docs/ux/parity.md, e2e/parity/README.md).
      - name: UX Parity
        run: pnpm test:parity

      - name: Upload Parity Report
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report-parity
          path: playwright-report-parity-react/
          retention-days: 7

      # Evidence for the reviewer, not a gate.
      - name: Screenshot Touched Tools
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          tools=$(node e2e/parity/touched-tools.ts HEAD^1)
          echo "Tools this pull request touches: ${tools:-none}"
          if [ -n "$tools" ]; then
            SCREENSHOT_TOOLS="$tools" pnpm test:parity --project=screenshots
          fi

      - name: Upload Screenshots
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: parity-screenshots
          path: parity-screenshots/
          if-no-files-found: ignore
          retention-days: 14
