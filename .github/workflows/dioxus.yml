# The `dioxus` check (ADR-0036 §2, docs/quality/gates.md → "Required checks").
# It exists on `develop` only, and has no path filters: a required check that
# is skipped leaves the PR stuck. Every cargo gate runs over the gated packages
# by name (-p), never over the whole workspace, so React's wasm/ crates are
# left as they are on `main`.
name: Dioxus

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  # The byte check reads the PR's labels (bytes-jump-accepted).
  pull-requests: read

concurrency:
  group: dioxus-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  dioxus:
    name: dioxus
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ADR-0035 §1: a badly resolved conflict from `main` must not bring the
      # nested workspace back, or cargo quietly runs two workspaces.
      - name: No nested workspace under wasm/
        run: |
          for file in wasm/Cargo.toml wasm/Cargo.lock; do
            if [[ -e "$file" ]]; then
              echo "::error file=$file::$file is back; the workspace lives at the root (ADR-0035 §1)"
              exit 1
            fi
          done

      - name: Merge base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: echo "MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD^2)" >>"$GITHUB_ENV"

      - name: Setup Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: dioxus-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            dioxus-${{ runner.os }}-

      # Pinned to a commit SHA, so each tool is installed against a checksum
      # (ADR-0031, condition 3).
      - name: Install the gate tools
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny@0.22.1,cargo-shear@1.14.1,cargo-mutants@27.1.0

      # The action has no manifest for jscpd or dx, so they come from
      # crates.io through its pinned cargo-binstall (ADR-0036, amended).
      - name: Install jscpd and dx
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: jscpd@5.4.3,dioxus-cli@0.7.10
          fallback: cargo-binstall

      - name: Gated packages
        run: |
          packages=$(crates/gates/scripts/gated-packages.sh)
          echo "Gated packages: $packages"
          echo "GATED=$(echo "$packages" | sed 's/^/-p /' | tr '\n' ' ')" >>"$GITHUB_ENV"

      # The path check (gates.md step 1) runs in pr-body.yml, which reruns
      # when the title changes. Every gate here runs even when an earlier one
      # fails (`!cancelled()`), so one red gate never hides the others.
      # Formatting: dx fmt where there is rsx!, then cargo fmt, then no diff.
      # dx fmt goes file by file: run over a whole crate it would also rewrite
      # the gates crate's must-fail fixtures.
      - name: Formatting
        if: ${{ !cancelled() }}
        run: |
          root="$(pwd)/"
          for package in $(crates/gates/scripts/gated-packages.sh); do
            dir=$(cargo metadata --no-deps --offline --format-version 1 |
              jq -r --arg name "$package" '.packages[] | select(.name == $name) | .manifest_path' | xargs dirname)
            dir="${dir#"$root"}"
            for file in $(grep -rls --include='*.rs' 'rsx!' "$dir" | grep -v '^crates/gates/fixtures/' || true); do
              if ! output=$(dx fmt --file "$file" 2>&1) || grep -q 'ERROR' <<<"$output"; then
                echo "$output"
                echo "::error file=$file::dx fmt failed on $file"
                exit 1
              fi
            done
          done
          cargo fmt $GATED
          git diff --exit-code

      # 3. Clippy, for the host and wasm32, with every warning denied.
      - name: Clippy (host)
        if: ${{ !cancelled() }}
        run: cargo clippy $GATED --all-targets -- -D warnings
      - name: Clippy (wasm32)
        if: ${{ !cancelled() }}
        run: cargo clippy $GATED --all-targets --target wasm32-unknown-unknown -- -D warnings

      # 4. Tests, the gates crate's included: its tests run each custom
      # check's must-fail fixture, and the real tree through every check.
      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test $GATED

      # 5. The must-fail Clippy fixture: every denied lint and banned method fires.
      - name: Clippy fixture fails
        if: ${{ !cancelled() }}
        run: crates/gates/scripts/clippy-fixture.sh

      # 6. Dependencies and copied code.
      - name: cargo-deny
        if: ${{ !cancelled() }}
        run: crates/gates/scripts/deny.sh
      - name: cargo-shear
        if: ${{ !cancelled() }}
        run: cargo shear --deny-warnings $GATED
      - name: jscpd
        if: ${{ !cancelled() }}
        run: jscpd --config .jscpd.json

      # 7. Mutation testing on the changed lines.
      - name: cargo-mutants --in-diff
        if: ${{ !cancelled() }}
        run: crates/gates/scripts/mutants.sh "$MERGE_BASE" HEAD^2

      # Node runs the TypeScript gates, the registry generator and the later
      # Dioxus steps. It comes after the gated packages are known, so a failed
      # install cannot leave GATED empty and widen the cargo gates to wasm/.
      - name: Setup pnpm
        if: ${{ !cancelled() }}
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install npm packages
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile

      # 8. oxlint and oxfmt over crates/bridges/js and scripts/dioxus, and the
      # npm licence rule; then their must-fail fixture.
      - name: TypeScript gates
        if: ${{ !cancelled() }}
        run: crates/gates/scripts/ts-gates.sh
      - name: TypeScript gates fixture fails
        if: ${{ !cancelled() }}
        run: crates/gates/scripts/ts-gates-fixture.sh

      # The registry is generated from tool-routes.ts (ADR-0035 §6), and the
      # checked-in file must be what the generator writes now.
      - name: Registry is generated from tool-routes.ts
        if: ${{ !cancelled() }}
        run: |
          node scripts/dioxus/generate-registry.ts
          if ! git diff --exit-code crates/registry/src/generated.rs; then
            echo "::error file=crates/registry/src/generated.rs::generated.rs is stale: run node scripts/dioxus/generate-registry.ts and commit it"
            exit 1
          fi

      # 9. The Dioxus build, the byte check and the CSP run (gates.md →
      # "Byte ceilings" and "CSP"). The checkout is the merge commit, so the
      # 2% rule compares it with the base branch's tip (HEAD^1), not the merge
      # base: growth already on the base branch is not this PR's. The base is
      # built when it has an app, sharing the target directory.
      - name: Dioxus build
        id: build
        if: ${{ !cancelled() }}
        run: crates/gates/scripts/build-dioxus.sh . dist-dioxus
      - name: Dioxus build of the base branch
        id: build-base
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if git cat-file -e "HEAD^1:crates/app/Cargo.toml" 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
            CARGO_TARGET_DIR="$PWD/target" crates/gates/scripts/build-dioxus.sh "$RUNNER_TEMP/base" "$RUNNER_TEMP/dist-base"
          else
            echo "The base branch has no crates/app: no 2% rule this time."
          fi

      # The spec filter's PORTED, as Node evaluates it, equals the ported-Tool list.
      - name: Dioxus spec filter
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node crates/gates/scripts/spec-filter.mjs >"$RUNNER_TEMP/spec-filter.json"
          GATES_SPEC_FILTER="$RUNNER_TEMP/spec-filter.json" \
            cargo test -p gates --test spec_filter -- --ignored --exact spec_filter

      # The maintainer accepts a planned jump of more than 2% with the
      # bytes-jump-accepted label (gates.md → "Byte ceilings"); agents never add
      # it. Labels are read live, so adding it and re-running this job is enough.
      # It covers the commits the maintainer saw: it counts only when it was last
      # added after the PR's head was committed, so a later commit needs it re-added.
      - name: Byte check
        if: ${{ !cancelled() && steps.build-base.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name')
          accepted=""
          if grep -qx 'bytes-jump-accepted' <<<"$labels"; then
            labeled_at=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/events" \
              --jq '.[] | select(.event == "labeled" and .label.name == "bytes-jump-accepted") | .created_at' | tail -n 1)
            committed_at=$(git log -1 --format=%cI HEAD^2)
            if [[ -n "$labeled_at" && $(date -d "$labeled_at" +%s) -gt $(date -d "$committed_at" +%s) ]]; then
              accepted=1
            else
              echo "::warning::bytes-jump-accepted predates the head commit; re-add it to accept this commit's bytes"
            fi
          fi
          node crates/gates/scripts/measure-bytes.mjs dist-dioxus >"$RUNNER_TEMP/bytes-head.json"
          base=""
          if [[ -d "$RUNNER_TEMP/dist-base" ]]; then
            node crates/gates/scripts/measure-bytes.mjs "$RUNNER_TEMP/dist-base" >"$RUNNER_TEMP/bytes-base.json"
            base="$RUNNER_TEMP/bytes-base.json"
          fi
          GATES_BYTES_HEAD="$RUNNER_TEMP/bytes-head.json" GATES_BYTES_BASE="$base" \
            GATES_BYTES_JUMP_ACCEPTED="$accepted" cargo test -p gates --test bytes -- --ignored --exact byte_check --nocapture

      # Every test the Dioxus project runs gets the CSP fixture
      # (e2e/parity/csp.ts); its must-fail check runs here too.
      - name: CSP run
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          pnpm exec playwright install --with-deps chromium webkit
          pnpm exec playwright test -c playwright.dioxus.config.ts
