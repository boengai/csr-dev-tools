name: Deploy to Cloudflare Pages Preview

# No pull_request trigger, so a fork can never reach the Cloudflare secrets.
on:
  push:
    branches: [develop, spike/dioxus]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # On spike/dioxus the Build step is the Dioxus build (issue 18), so the
      # preview address serves the spike. develop keeps its own copy of this file.
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dioxus/target
          key: dioxus-${{ runner.os }}-${{ hashFiles('dioxus/Cargo.lock') }}
          restore-keys: |
            dioxus-${{ runner.os }}-

      - name: Install dx 0.7.10
        run: |
          curl -sSL -o "$RUNNER_TEMP/dx.tar.gz" https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz
          echo "4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7  $RUNNER_TEMP/dx.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/dx.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build
        run: dioxus/scripts/build.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dioxus/dist --project-name=csr-dev-tools --branch=${{ github.ref_name }}

      - name: Check the preview is not indexed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # Pages serves branch a/b at the alias a-b.
          curl -sSI --fail --retry 10 --retry-delay 5 --retry-all-errors \
            "https://${BRANCH//\//-}.csr-dev-tools.pages.dev/" | grep -i '^x-robots-tag:.*noindex'
