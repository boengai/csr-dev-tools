[package]
name = "certificate"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x509-parser = "0.16"
oid-registry = "0.7"
chrono = { version = "0.4", default-features = false, features = ["std"] }
